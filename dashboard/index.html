<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chakranetra — Road Operations Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  /* ── Asphalt & road-marking design tokens ─────────────────────────── */
  :root {
    --asphalt:  #101418;   /* page — wet asphalt at night */
    --surface:  #181E25;   /* panels */
    --surface2: #1F2630;   /* raised rows */
    --line:     #2A323C;   /* hairlines */
    --marking:  #F7B500;   /* road-marking yellow — the accent */
    --chalk:    #E9EDF2;   /* primary text */
    --faded:    #8B96A3;   /* secondary text */
    --sev4: #FF4A3A;  --sev3: #FF9330;  --sev2: #F5C84C;  --sev1: #6FA8DC;
    --ok: #36C98E;
    --mono: "IBM Plex Mono", monospace;
  }
  /* Darken the light OSM raster to match the console's asphalt palette.
     Scoped to the tile pane so severity markers keep their true colours. */
  .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.55);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--asphalt); color: var(--chalk);
    font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  button, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--marking); outline-offset: 2px; }

  /* ── Header: hazard-tape strip is the signature ───────────────────── */
  header {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .hazard-tape {
    height: 6px;
    background: repeating-linear-gradient(-45deg,
      var(--marking) 0 14px, #14181d 14px 28px);
  }
  .head-row {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 22px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: "Saira Condensed", sans-serif; font-weight: 700;
    font-size: 26px; letter-spacing: .04em; text-transform: uppercase;
  }
  .brand h1 span { color: var(--marking); }
  .brand .zone {
    font-family: var(--mono); font-size: 12px; color: var(--faded);
    border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px;
  }
  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    background: var(--asphalt); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 14px; min-width: 96px;
  }
  .stat b {
    display: block; font-family: "Saira Condensed", sans-serif;
    font-size: 24px; font-weight: 600; line-height: 1.1;
  }
  .stat span { font-size: 11px; color: var(--faded); text-transform: uppercase; letter-spacing: .06em; }
  .stat.crit b { color: var(--sev4); }
  .stat.due  b { color: var(--sev3); }
  .stat.cost b { color: var(--marking); }
  .stat.done b { color: var(--ok); }

  /* ── Main split: map + work queue ─────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1.35; min-width: 0; background: #0b0e11; }
  aside {
    flex: 1; min-width: 380px; max-width: 560px;
    border-left: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; min-height: 0;
  }
  .queue-head {
    padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .queue-head h2 {
    font-family: "Saira Condensed", sans-serif; font-size: 17px;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  }
  .queue-head select {
    background: var(--asphalt); color: var(--chalk);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px;
    font-size: 12px;
  }
  #list { overflow-y: auto; padding: 10px 12px 20px; flex: 1; }

  /* ── Ticket card ──────────────────────────────────────────────────── */
  .ticket {
    background: var(--surface2); border: 1px solid var(--line);
    border-left: 4px solid var(--sev2); border-radius: 7px;
    padding: 11px 14px; margin-bottom: 9px; cursor: pointer;
    transition: border-color .15s;
  }
  .ticket:hover, .ticket.active { border-color: var(--marking); }
  .ticket[data-sev="4"] { border-left-color: var(--sev4); }
  .ticket[data-sev="3"] { border-left-color: var(--sev3); }
  .ticket[data-sev="2"] { border-left-color: var(--sev2); }
  .ticket[data-sev="1"] { border-left-color: var(--sev1); }

  .t-top { display: flex; align-items: center; gap: 10px; }
  .t-id { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .chip {
    font-size: 10px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; border-radius: 3px; padding: 2px 7px;
    color: #14181d;
  }
  .chip.s4 { background: var(--sev4); color: #fff; }
  .chip.s3 { background: var(--sev3); }
  .chip.s2 { background: var(--sev2); }
  .chip.s1 { background: var(--sev1); color: #fff; }
  .t-status {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--faded);
  }
  .t-status.done { color: var(--ok); }

  .t-mid {
    display: flex; gap: 16px; margin-top: 7px; font-size: 12px;
    color: var(--faded); flex-wrap: wrap;
  }
  .t-mid b { color: var(--chalk); font-weight: 500; }

  .t-bottom { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
  .prio-track {
    flex: 1; height: 5px; background: var(--asphalt); border-radius: 3px;
    overflow: hidden;
  }
  .prio-fill { height: 100%; background: var(--marking); }
  .sla { font-family: var(--mono); font-size: 11px; color: var(--faded); white-space: nowrap; }
  .sla.overdue { color: var(--sev4); }
  .t-bottom select {
    background: var(--asphalt); color: var(--chalk); font-size: 11px;
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px;
  }

  .empty { color: var(--faded); text-align: center; padding: 60px 20px; }
  .src-note {
    padding: 8px 18px; font-size: 11px; color: var(--faded);
    border-top: 1px solid var(--line); font-family: var(--mono);
  }

  /* Critical map markers pulse — unless the viewer prefers less motion */
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,74,58,.55)} 100%{box-shadow:0 0 0 16px rgba(255,74,58,0)} }
  .pin { border-radius: 50%; border: 2px solid #fff; }
  .pin.s4 { animation: pulse 1.6s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pin.s4 { animation: none; } }

  /* ── Tabs ─────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 2px; width: 100%; flex-wrap: wrap; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--faded); padding: 6px 9px 8px; cursor: pointer;
    font-family: "Saira Condensed", sans-serif; font-size: 14px;
    letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  }
  .tab:hover { color: var(--chalk); }
  .tab[aria-selected="true"] { color: var(--marking); border-bottom-color: var(--marking); }
  .tab .count {
    font-family: var(--mono); font-size: 10px; background: var(--asphalt);
    border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; margin-left: 6px;
  }
  .panel { display: none; overflow-y: auto; padding: 10px 12px 20px; flex: 1; }
  .panel.active { display: block; }

  .ctl-row { display: flex; gap: 8px; padding: 0 18px 10px; flex-wrap: wrap; align-items: center; }
  .ctl-row input, .ctl-row select {
    background: var(--asphalt); color: var(--chalk); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 8px; font-size: 12px;
  }
  .ctl-row input { flex: 1; min-width: 120px; font-family: var(--mono); }
  .ghost-btn {
    background: none; color: var(--faded); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 9px; font-size: 11px; cursor: pointer;
  }
  .ghost-btn:hover { color: var(--marking); border-color: var(--marking); }

  /* ── Predictive + crew cards ──────────────────────────────────────── */
  .card {
    background: var(--surface2); border: 1px solid var(--line);
    border-left: 4px solid var(--sev2); border-radius: 7px;
    padding: 12px 14px; margin-bottom: 9px;
  }
  .card.critical { border-left-color: var(--sev4); }
  .card.high     { border-left-color: var(--sev3); }
  .card.medium   { border-left-color: var(--sev2); }
  .card.low      { border-left-color: var(--sev1); }
  .card h3 {
    font-size: 13px; font-weight: 600; display: flex; align-items: center;
    gap: 9px; margin-bottom: 6px;
  }
  .card p { font-size: 12px; color: var(--faded); line-height: 1.55; }
  .card .kv { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--faded); }
  .card .kv b { color: var(--chalk); font-weight: 500; }

  .meter { height: 6px; background: var(--asphalt); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; background: var(--marking); }
  .meter i.good { background: var(--ok); }
  .meter i.bad  { background: var(--sev4); }

  .section-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faded); margin: 14px 2px 8px;
  }

  /* ── Severity distribution bar ────────────────────────────────────── */
  .dist { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .dist span { display: block; }
  .dist-key { display: flex; gap: 12px; font-size: 11px; color: var(--faded); flex-wrap: wrap; }
  .dist-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  /* ── Ticket detail drawer ─────────────────────────────────────────── */
  .drawer {
    position: fixed; inset: 0 0 0 auto; width: min(430px, 100%);
    background: var(--surface); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .22s ease;
    z-index: 1200; display: flex; flex-direction: column;
    box-shadow: -18px 0 44px rgba(0,0,0,.5);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .drawer-head .t-id { font-size: 15px; }
  .drawer-body { overflow-y: auto; padding: 16px 18px 28px; }
  .drawer .close {
    margin-left: auto; background: none; border: 0; color: var(--faded);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
  }
  .drawer .close:hover { color: var(--marking); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 12.5px; }
  .facts dt { color: var(--faded); }
  .facts dd { color: var(--chalk); font-family: var(--mono); font-size: 12px; }

  .timeline { list-style: none; margin-top: 8px; }
  .timeline li {
    position: relative; padding: 0 0 16px 20px;
    border-left: 1px solid var(--line); font-size: 12px;
  }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline li::before {
    content: ""; position: absolute; left: -5px; top: 3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--marking); border: 2px solid var(--surface);
  }
  .timeline .when { font-family: var(--mono); color: var(--faded); font-size: 11px; }
  .timeline .note { color: var(--faded); margin-top: 2px; }
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 1100;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  /* ── Scan panel ───────────────────────────────────────────────────── */
  .scan-intro { font-size: 12.5px; color: var(--faded); line-height: 1.6; margin-bottom: 12px; }
  .scan-intro b { color: var(--chalk); font-weight: 500; }
  .scan-drop {
    border: 1px dashed var(--line); border-radius: 8px; padding: 18px 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    justify-content: center; margin-bottom: 10px; transition: border-color .15s;
  }
  .scan-drop.hot { border-color: var(--marking); background: rgba(247,181,0,.05); }
  .scan-or { color: var(--faded); font-size: 12px; }
  .scan-drop select {
    background: var(--asphalt); color: var(--chalk); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 8px; font-size: 12px;
  }
  .scan-lbl { font-family: var(--mono); font-size: 11px; color: var(--faded); }
  .scan-lbl input {
    background: var(--asphalt); color: var(--chalk); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 7px; font-size: 12px; width: 108px;
    font-family: var(--mono); margin-left: 4px;
  }
  .scan-status { font-family: var(--mono); font-size: 11.5px; color: var(--faded); min-height: 18px; }
  .scan-status.err { color: var(--sev4); }
  .scan-bar { height: 4px; background: var(--asphalt); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .scan-bar i { display: block; height: 100%; background: var(--marking); width: 0; transition: width .15s; }
  #scan-out canvas { width: 100%; border-radius: 7px; margin: 12px 0 6px; display: block; }
  .scan-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--faded); margin-bottom: 10px; }
  .scan-sum b { color: var(--chalk); }

  /* ── Map overlay control ──────────────────────────────────────────── */
  .map-ctl {
    position: absolute; z-index: 500; top: 12px; right: 12px;
    display: flex; gap: 6px;
  }
  .map-ctl button {
    background: rgba(24,30,37,.94); color: var(--faded);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 10px; font-size: 11px; cursor: pointer;
    font-family: var(--mono);
  }
  .map-ctl button[aria-pressed="true"] { color: var(--marking); border-color: var(--marking); }
  .map-wrap { flex: 1.35; min-width: 0; position: relative; display: flex; }
  .map-wrap #map { flex: 1; min-width: 0; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    .map-wrap { min-height: 320px; flex: none; height: 42vh; }
    aside { max-width: none; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<header>
  <div class="hazard-tape" aria-hidden="true"></div>
  <div class="head-row">
    <div class="brand">
      <h1>Chakra<span>netra</span></h1>
      <span class="zone" id="zone">BENGALURU · ORR PILOT</span>
    </div>
    <div class="stats" id="stats" aria-label="City road health summary"></div>
  </div>
</header>

<main>
  <div class="map-wrap">
  <div id="map" role="application" aria-label="Defect map"></div>
  <div class="map-ctl">
    <button id="btn-heat" aria-pressed="false" title="Overlay the predictive risk heatmap">RISK HEATMAP</button>
    <button id="btn-fit" title="Zoom to fit every defect">FIT</button>
  </div>
  </div>

  <aside>
    <div class="queue-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-queue"   aria-selected="true"  aria-controls="panel-queue">Work queue<span class="count" id="c-queue">0</span></button>
        <button class="tab" role="tab" id="tab-predict" aria-selected="false" aria-controls="panel-predict">Predictive<span class="count" id="c-predict">0</span></button>
        <button class="tab" role="tab" id="tab-crews"   aria-selected="false" aria-controls="panel-crews">Crews<span class="count" id="c-crews">0</span></button>
        <button class="tab" role="tab" id="tab-scan"    aria-selected="false" aria-controls="panel-scan">Scan</button>
      </div>
    </div>

    <div class="ctl-row" id="ctl-queue">
      <input id="q" type="search" placeholder="search id, type, engineer…" aria-label="Search tickets" />
      <select id="f-status" aria-label="Filter by status"><option value="">All statuses</option></select>
      <select id="f-dept" aria-label="Filter by department"><option value="">All departments</option></select>
      <select id="f-sort" aria-label="Sort tickets">
        <option value="priority">Priority</option>
        <option value="severity">Severity</option>
        <option value="sla">SLA soonest</option>
        <option value="cost">Cost</option>
      </select>
      <button class="ghost-btn" id="btn-reset" title="Undo local status changes">Reset</button>
    </div>

    <div class="panel active" id="panel-queue" role="tabpanel" aria-labelledby="tab-queue">
      <div id="list"></div>
    </div>
    <div class="panel" id="panel-predict" role="tabpanel" aria-labelledby="tab-predict"></div>
    <div class="panel" id="panel-crews" role="tabpanel" aria-labelledby="tab-crews"></div>

    <div class="panel" id="panel-scan" role="tabpanel" aria-labelledby="tab-scan">
      <div class="section-label">Scan a road photo</div>
      <p class="scan-intro">
        The pothole segmentation model runs <b>in this browser</b> — the photo
        never leaves your device. Detection, deduplication and scoring use the
        same rules as the Python engine, verified equal by the test suite.
      </p>

      <div class="scan-drop" id="scan-drop">
        <input type="file" id="scan-file" accept="image/*" hidden />
        <button class="ghost-btn" id="scan-pick">Choose a photo</button>
        <span class="scan-or">or</span>
        <select id="scan-sample" aria-label="Use a sample photo">
          <option value="">use a sample…</option>
        </select>
      </div>

      <div class="ctl-row" style="padding-left:0;padding-right:0">
        <label class="scan-lbl">lat <input id="scan-lat" type="number" step="0.000001" value="12.951600" /></label>
        <label class="scan-lbl">lon <input id="scan-lon" type="number" step="0.000001" value="77.699500" /></label>
        <button class="ghost-btn" id="scan-run">Scan</button>
      </div>

      <div id="scan-status" class="scan-status"></div>
      <div id="scan-out"></div>
    </div>

    <div class="src-note" id="src-note">connecting…</div>
  </aside>
</main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-id" hidden>
  <div class="drawer-head">
    <span class="t-id" id="drawer-id"></span>
    <span class="chip" id="drawer-chip"></span>
    <button class="close" id="drawer-close" aria-label="Close ticket detail">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script src="demo_data.js" onerror="void 0"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script type="module">
import { assess, haversineM, RULES } from "./rules.generated.js";
import { detect, loadModel, renderOverlay, modelBytes } from "./scan.js";

const STATUSES = ["OPEN","ASSIGNED","IN_PROGRESS","FIXED","VERIFIED","REOPENED"];
const SEV_COLORS = {4:"#FF4A3A",3:"#FF9330",2:"#F5C84C",1:"#6FA8DC"};
const SEV_NAME   = {4:"Critical",3:"High",2:"Medium",1:"Low"};
const STORE_KEY  = "chakranetra.overrides.v1";

const state = {
  tickets: [], stats: {}, alerts: [], segments: [], crews: [], heatmap: [],
  live: false, activeId: null, view: "queue", overrides: {},
};

const $  = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const inr = (n) => (Number(n) || 0).toLocaleString("en-IN");

/* ── Local persistence: status changes survive a reload in demo mode ── */
function loadOverrides() {
  try { state.overrides = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { state.overrides = {}; }
}
function saveOverrides() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.overrides)); } catch {}
}
function applyOverrides() {
  for (const t of state.tickets) {
    const o = state.overrides[t.id];
    if (o) { t.status = o.status; t.status_history = o.history || t.status_history; }
  }
}

/* ── Data: live API first, embedded engine output as fallback ───────── */
async function loadData() {
  try {
    const [t, s, a, g, c] = await Promise.all([
      fetch("/api/tickets").then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch("/api/stats").then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch("/api/predictive/alerts").then(r => r.ok ? r.json() : []).catch(() => []),
      fetch("/api/predictive/segments").then(r => r.ok ? r.json() : []).catch(() => []),
      fetch("/api/predictive/crews").then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    state.tickets = t; state.stats = s; state.alerts = a;
    state.segments = g; state.crews = c; state.live = true;
    state.heatmap = await fetch("/api/predictive/heatmap").then(r => r.ok ? r.json() : []).catch(() => []);
  } catch {
    const d = window.CHAKRANETRA_DEMO;
    if (d) {
      state.tickets = d.tickets || []; state.stats = d.stats || {};
      state.alerts = d.alerts || [];   state.segments = d.segments || [];
      state.crews = d.crews || [];     state.heatmap = d.heatmap || [];
      loadOverrides(); applyOverrides(); recomputeLocalStats(false);
    }
  }
  $("src-note").textContent = state.live
    ? "live · connected to Chakranetra API"
    : "engine output · every figure computed by roadlens/, replayed offline";
}

/* ── Map ────────────────────────────────────────────────────────────── */
let map, markers = {}, heatLayer = null, heatOn = false;
function initMap() {
  map = L.map("map", { zoomControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors", maxZoom: 19,
  }).addTo(map);

}

function drawMarkers() {
  Object.values(markers).forEach(m => m.remove());
  markers = {};
  const pts = [];
  for (const t of state.tickets) {
    if (t.lat == null || t.lon == null) continue;
    pts.push([t.lat, t.lon]);
    const done = ["FIXED","VERIFIED"].includes(t.status);
    const color = done ? "#36C98E" : SEV_COLORS[t.severity_level];
    const size = 10 + t.severity_level * 3;
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin ${done ? "" : "s" + t.severity_level}"
        style="width:${size}px;height:${size}px;background:${color}"></div>`,
      iconSize: [size, size], iconAnchor: [size/2, size/2],
    });
    markers[t.id] = L.marker([t.lat, t.lon], { icon })
      .addTo(map)
      .bindPopup(
        `<b style="font-family:monospace">${esc(t.id)}</b><br>` +
        `${esc(t.severity_label)} ${esc(t.defect_type)} · seen ${t.sightings}x ` +
        `· est INR ${inr(t.est_cost_inr)}<br>${esc(t.department)}`
      )
      .on("click", () => { selectTicket(t.id, false); openDrawer(t.id); });
  }
  if (pts.length) map.fitBounds(pts, { padding: [32, 32], maxZoom: 17 });
}

function buildHeatLayer() {
  if (heatLayer) { heatLayer.remove(); heatLayer = null; }
  if (!state.heatmap.length) return;
  heatLayer = L.layerGroup(state.heatmap.map(cell => {
    const intensity = Math.max(cell.intensity || 0, 0.15);
    return L.circle([cell.lat, cell.lon], {
      radius: 260,
      color: "#F7B500", weight: 1, opacity: 0.55,
      fillColor: "#F7B500", fillOpacity: 0.10 + intensity * 0.35,
    }).bindPopup(
      `<b>Risk cell</b><br>${cell.defect_count} defect(s)` +
      `<br>max severity L${cell.max_severity}` +
      `<br>${cell.recurrence_count} recurrence(s)`
    );
  }));
}

function toggleHeat() {
  heatOn = !heatOn;
  $("btn-heat").setAttribute("aria-pressed", String(heatOn));
  if (!heatLayer) buildHeatLayer();
  if (!heatLayer) return;
  heatOn ? heatLayer.addTo(map) : heatLayer.remove();
}

/* ── SLA helpers (live-ticking) ─────────────────────────────────────── */
function slaText(t) {
  if (["FIXED","VERIFIED"].includes(t.status)) return { txt: "closed", overdue: false };
  const ms = new Date(t.sla_due_at) - Date.now();
  const abs = Math.abs(ms);
  const h = abs / 36e5;
  let span;
  if (h >= 48)     span = Math.round(h / 24) + "d";
  else if (h >= 1) span = Math.floor(h) + "h " + Math.floor((abs % 36e5) / 6e4) + "m";
  else             span = Math.floor(abs / 6e4) + "m " + Math.floor((abs % 6e4) / 1000) + "s";
  return ms < 0 ? { txt: "SLA +" + span + " over", overdue: true }
                : { txt: "SLA in " + span, overdue: false };
}
function tickSla() {
  document.querySelectorAll("[data-due]").forEach(el => {
    const t = state.tickets.find(x => x.id === el.dataset.due);
    if (!t) return;
    const s = slaText(t);
    el.textContent = s.txt;
    el.classList.toggle("overdue", s.overdue);
  });
}

/* ── Work queue ─────────────────────────────────────────────────────── */
function visibleTickets() {
  const fs = $("f-status").value, fd = $("f-dept").value;
  const q = ($("q").value || "").trim().toLowerCase();
  const sort = $("f-sort").value;

  let rows = state.tickets.filter(t =>
    (!fs || t.status === fs) &&
    (!fd || t.department === fd) &&
    (!q || [t.id, t.defect_type, t.assigned_to, t.department, t.severity_label]
      .some(v => String(v ?? "").toLowerCase().includes(q))));

  const cmp = {
    priority: (a, b) => b.priority_score - a.priority_score,
    severity: (a, b) => b.severity_level - a.severity_level || b.priority_score - a.priority_score,
    cost:     (a, b) => b.est_cost_inr - a.est_cost_inr,
    sla:      (a, b) => new Date(a.sla_due_at) - new Date(b.sla_due_at),
  }[sort] || ((a, b) => b.priority_score - a.priority_score);

  return rows.slice().sort(cmp);
}

function distributionBar(rows) {
  const total = rows.length || 1;
  const counts = [4,3,2,1].map(l => ({ l, n: rows.filter(t => t.severity_level === l).length }));
  const bars = counts.filter(c => c.n)
    .map(c => `<span style="width:${(c.n/total*100).toFixed(1)}%;background:${SEV_COLORS[c.l]}"></span>`).join("");
  const key = counts.filter(c => c.n)
    .map(c => `<span><i style="background:${SEV_COLORS[c.l]}"></i>${SEV_NAME[c.l]} ${c.n}</span>`).join("");
  return `<div class="dist">${bars}</div><div class="dist-key">${key}</div>
          <div class="section-label">${rows.length} ticket(s) in view</div>`;
}

  return Array.isArray(h) ? h : [];
}

/* ── Status changes: API when live, persisted locally in demo mode ─── */
async function moveTicket(id, status) {
  if (state.live) {
    try {
      const r = await fetch(`/api/tickets/${encodeURIComponent(id)}/status`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, note: "Updated from console" }),
      });
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
      const i = state.tickets.findIndex(t => t.id === id);
      if (i === -1) throw new Error("Ticket vanished from the local queue");
      state.tickets[i] = body;
    } catch (err) {
      $("src-note").textContent = `update failed: ${err.message}`;
      drawList();
      return;
    }
  } else {
    const t = state.tickets.find(t => t.id === id);
    if (!t) return;
    const hist = historyOf(t);
    hist.push({ status, at: new Date().toISOString(), note: "Updated from console" });
    t.status = status;
    t.status_history = hist;
    state.overrides[id] = { status, history: hist };
    saveOverrides();
  }
  recomputeLocalStats();
  drawList(); drawMarkers();
}

function recomputeLocalStats(redraw = true) {
  if (state.live) {
    fetch("/api/stats").then(r => r.json()).then(s => { state.stats = s; drawStats(); });
    return;
  }
  const open = state.tickets.filter(t => !["FIXED","VERIFIED"].includes(t.status));
  state.stats = {
    open: open.length,
    critical_open: open.filter(t => t.severity_level === 4).length,
    overdue_sla: open.filter(t => new Date(t.sla_due_at) < Date.now()).length,
    est_backlog_cost_inr: open.reduce((a, t) => a + (t.est_cost_inr || 0), 0),
    fixed_or_verified: state.tickets.length - open.length,
  };
  if (redraw) drawStats();
}

  "img_0053_jpg.rf.376bece2d8a0653ee55a564c6628436c.jpg",

  "img_0118_jpg.rf.a1855b77c61edf26542265e4c1f3a20f.jpg",

function setStatus(msg, isErr = false, pct = null) {
  const el = $("scan-status");
  el.classList.toggle("err", isErr);
  el.innerHTML = esc(msg) + (pct === null ? "" :
    `<div class="scan-bar"><i style="width:${Math.round(pct * 100)}%"></i></div>`);
}

function nextTicketId(defectType) {
  const prefix = `RL-${defectType.slice(0, 3).toUpperCase()}-${new Date().getFullYear()}`;
  let high = 0;
  for (const t of state.tickets) {
    if (!t.id.startsWith(prefix + "-")) continue;
    const n = parseInt(t.id.split("-").pop(), 10);
    if (Number.isFinite(n)) high = Math.max(high, n);
  }
  return `${prefix}-${String(high + 1).padStart(4, "0")}`;
}

/** Build/merge tickets exactly the way dedup.py + tickets.py do. */
function fileTickets(detections, lat, lon, sourceName) {
  const now = new Date();
  const created = [], merged = [];

  detections.forEach((d, i) => {
    const type = "pothole";
    // Same-frame rule: two defects in ONE photo are always distinct, so only
    // consider tickets that did not come from this same scan.
    const near = state.tickets.find(t =>
      t.defect_type === type &&
      t.lat != null && !created.includes(t) &&
      haversineM(t.lat, t.lon, lat, lon) <= RULES.mergeRadiusMeters &&
      !(t._lastSource === sourceName));

    if (near) {
      near.sightings += 1;
      near.area_ratio = Math.max(near.area_ratio, d.area_ratio);
      near.confidence = Math.max(near.confidence, d.confidence);
      const a = assess(type, near.area_ratio, near.confidence, near.sightings);
      Object.assign(near, {
        severity_level: a.severity_level, severity_label: a.severity_label,
        priority_score: a.priority_score, est_cost_inr: a.est_cost_inr,
        department: a.department, _lastSource: sourceName,
      });
      merged.push(near);
      return;
    }

    const a = assess(type, d.area_ratio, d.confidence, 1);
    const due = new Date(now.getTime() + a.sla_hours * 3600e3);
    const t = {
      id: nextTicketId(type),
      defect_type: type,
      lat: +(lat + (i ? i * 0.000012 : 0)).toFixed(6),
      lon: +(lon + (i ? i * 0.000012 : 0)).toFixed(6),
      severity_level: a.severity_level, severity_label: a.severity_label,
      priority_score: a.priority_score, est_cost_inr: a.est_cost_inr,
      department: a.department, status: "OPEN", sightings: 1,
      confidence: +d.confidence.toFixed(3), area_ratio: +d.area_ratio.toFixed(5),
      sources: JSON.stringify([sourceName]),
      created_at: now.toISOString(), sla_due_at: due.toISOString(),
      assigned_to: null,
      status_history: [{ status: "OPEN", at: now.toISOString(),
                         note: "Auto-created by Chakranetra (in-browser scan)" }],
      recurrence_count: 0, repair_quality_score: 1.0, last_recurrence_at: null,
      _lastSource: sourceName,
    };
    state.tickets.push(t);
    created.push(t);
  });

  return { created, merged };
}

async function runScan(blobOrUrl, label) {
  const lat = parseFloat($("scan-lat").value);
  const lon = parseFloat($("scan-lon").value);
  if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
      Math.abs(lat) > 90 || Math.abs(lon) > 180) {
    setStatus("Enter a valid latitude (−90..90) and longitude (−180..180).", true);
    return;
  }

  const out = $("scan-out");
  out.innerHTML = "";
  try {
    setStatus(`Loading the model (${(modelBytes() / 1e6).toFixed(0)} MB, cached after the first run)…`, false, 0);
    await loadModel(p => setStatus(
      `Loading the model (${(modelBytes() / 1e6).toFixed(0)} MB, cached after the first run)…`, false, p));

    setStatus("Decoding image…");
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = typeof blobOrUrl === "string" ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    await img.decode();

    setStatus("Running segmentation…");
    const t0 = performance.now();
    const { detections, letterbox } = await detect(img, RULES.confidenceThreshold, 0.7);
    const ms = Math.round(performance.now() - t0);

    out.appendChild(renderOverlay(letterbox, detections));

    if (!detections.length) {
      setStatus(`No pothole above ${RULES.confidenceThreshold} confidence (${ms} ms).`);
      out.insertAdjacentHTML("beforeend",
        `<div class="empty" style="padding:18px">Nothing detected. The bundled
         model finds potholes only — try a sample photo.</div>`);
      return;
    }

    const { created, merged } = fileTickets(detections, lat, lon, label);
    setStatus(`${detections.length} defect(s) in ${ms} ms — inference ran locally.`);

    out.insertAdjacentHTML("beforeend", `<div class="scan-sum">
        <span>detections <b>${detections.length}</b></span>
        <span>new tickets <b>${created.length}</b></span>
        <span>merged into existing <b>${merged.length}</b></span>
      </div>`);
    for (const t of [...created, ...merged]) {
      out.insertAdjacentHTML("beforeend", `
        <div class="card ${t.severity_level === 4 ? "critical" : t.severity_level === 3 ? "high" : "medium"}">
          <h3>${esc(t.id)}
            <span class="chip s${t.severity_level}">${esc(t.severity_label)}</span></h3>
          <div class="kv">
            <span>priority <b>${t.priority_score}/100</b></span>
            <span>est <b>INR ${inr(t.est_cost_inr)}</b></span>
            <span>frame area <b>${(t.area_ratio * 100).toFixed(2)}%</b></span>
            <span>seen <b>${t.sightings}x</b></span>
            <span>${esc(t.department)}</span>
          </div>
        </div>`);
    }

    for (const t of [...created, ...merged]) {
      state.overrides[t.id] = { status: t.status, history: t.status_history, ticket: t };
    }
    saveOverrides();
    recomputeLocalStats();
    drawFilters(); drawList(); drawMarkers(); drawPredictive();
    $("c-queue").textContent = visibleTickets().length;
  } catch (err) {
    console.error(err);
    setStatus(`Scan failed: ${err.message}`, true);
  }
}

function initScan() {
  const sel = $("scan-sample");
  sel.innerHTML = `<option value="">use a sample…</option>` +
    SAMPLES.map(f => `<option value="${f}">${f.split("_jpg")[0]}</option>`).join("");

  $("scan-pick").addEventListener("click", () => $("scan-file").click());
  $("scan-file").addEventListener("change", e => {
    if (e.target.files?.[0]) runScan(e.target.files[0], e.target.files[0].name);
  });
  sel.addEventListener("change", e => {
    if (e.target.value) runScan(`samples/${e.target.value}`, e.target.value);
  });
  $("scan-run").addEventListener("click", () => {
    const f = $("scan-file").files?.[0];
    if (f) return runScan(f, f.name);
    if (sel.value) return runScan(`samples/${sel.value}`, sel.value);
    setStatus("Choose a photo or pick a sample first.", true);
  });

  const drop = $("scan-drop");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add("hot");
  }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove("hot");
  }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer?.files?.[0];
    if (f) runScan(f, f.name);
  });
}

/* ── Events ─────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  if (e.target.closest("#tab-queue"))   return setView("queue");
  if (e.target.closest("#tab-predict")) return setView("predict");
  if (e.target.closest("#tab-crews"))   return setView("crews");
  if (e.target.closest("#tab-scan"))    return setView("scan");
  if (e.target.closest("#btn-heat"))    return toggleHeat();
  if (e.target.closest("#btn-fit"))     return drawMarkers();
  if (e.target.closest("#drawer-close") || e.target.closest("#scrim")) return closeDrawer();
  if (e.target.closest("#btn-reset")) {
    state.overrides = {}; saveOverrides(); location.reload(); return;
  }
  const jump = e.target.closest(".seg-jump");
  if (jump) { map.setView([+jump.dataset.lat, +jump.dataset.lon], 16); return; }

  const card = e.target.closest(".ticket");
  if (card && !e.target.matches("select")) {
    selectTicket(card.dataset.id);
    openDrawer(card.dataset.id);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "Enter") {
    const card = e.target.closest?.(".ticket");
    if (card) { selectTicket(card.dataset.id); openDrawer(card.dataset.id); }
  }
});
document.addEventListener("change", e => {
  if (e.target.dataset.move) moveTicket(e.target.dataset.move, e.target.value);
  if (["f-status","f-dept","f-sort"].includes(e.target.id)) drawList();
});
document.addEventListener("input", e => { if (e.target.id === "q") drawList(); });

/* ── Boot ───────────────────────────────────────────────────────────── */
(async function () {
  initMap();
  await loadData();
  drawFilters(); drawStats(); drawList(); drawMarkers();
  drawPredictive(); drawCrews();
  const h = location.hash.slice(1);
  if (h.startsWith("t/")) { setView("queue", false); const id = decodeURIComponent(h.slice(2)); selectTicket(id); openDrawer(id); }
  else setView(h || "queue");
  buildHeatLayer();
  initScan();

  // ?autoscan=<sample filename> runs a scan on load. Doubles as a shareable
  // "here is the model working" link and as the hook the browser test drives.
  const auto = new URLSearchParams(location.search).get("autoscan");
  if (auto) {
    setView("scan", false);
    const sel = $("scan-sample");
    if ([...sel.options].some(o => o.value === auto)) sel.value = auto;
    runScan(`samples/${auto}`, auto);
  }
  setInterval(tickSla, 1000);
  window.addEventListener("hashchange", () => {
    const hh = location.hash.slice(1);
    if (!hh.startsWith("t/")) setView(hh, false);
  });
})();
</script>
</body>
